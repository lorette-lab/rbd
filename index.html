<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/refined-by-design-design-system-eafcfd01-3740-40e7-930d-c53938b83406/tokens/fonts.css">
<link rel="stylesheet" href="_ds/refined-by-design-design-system-eafcfd01-3740-40e7-930d-c53938b83406/tokens/colors.css">
<link rel="stylesheet" href="_ds/refined-by-design-design-system-eafcfd01-3740-40e7-930d-c53938b83406/tokens/typography.css">
<link rel="stylesheet" href="_ds/refined-by-design-design-system-eafcfd01-3740-40e7-930d-c53938b83406/tokens/spacing.css">
<link rel="stylesheet" href="_ds/refined-by-design-design-system-eafcfd01-3740-40e7-930d-c53938b83406/tokens/effects.css">
<link rel="stylesheet" href="_ds/refined-by-design-design-system-eafcfd01-3740-40e7-930d-c53938b83406/tokens/motion.css">
<link rel="stylesheet" href="_ds/refined-by-design-design-system-eafcfd01-3740-40e7-930d-c53938b83406/tokens/base.css">
<link rel="stylesheet" href="_ds/refined-by-design-design-system-eafcfd01-3740-40e7-930d-c53938b83406/styles.css">
<script src="_ds/refined-by-design-design-system-eafcfd01-3740-40e7-930d-c53938b83406/_ds_bundle.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:var(--grey-2)}
a{color:var(--text-link);text-decoration:none}
a:hover{color:var(--text-link-hover)}
@keyframes rbd-pulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.6);opacity:0}100%{transform:scale(2.6);opacity:0}}
@keyframes rbd-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rbd-steam{0%{opacity:0;transform:translateY(2px) scaleX(.9)}40%{opacity:.5}100%{opacity:0;transform:translateY(-14px) scaleX(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
@media (max-width:900px){
  [data-m="page"]{height:100dvh !important;padding:max(14px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom)) !important;gap:10px !important}
  [data-m="logo"]{height:30px !important;width:88px !important}
  [data-m="badge"]{padding:5px 11px 5px 9px !important;font-size:9.5px !important;letter-spacing:.1em !important}
  [data-m="main"]{grid-template-columns:1fr !important;grid-template-rows:auto minmax(0,1fr) !important;gap:0 !important}
  [data-m="text"]{padding:22px 20px 18px !important;gap:18px !important;justify-content:flex-start !important}
  [data-m="eyebrow"]{font-size:10px !important}
  [data-m="h1"]{font-size:clamp(32px,9vw,46px) !important;min-height:2em !important;align-items:flex-end !important}
  [data-m="note"]{font-size:14px !important;max-width:34ch !important;line-height:1.45 !important;min-height:2.9em !important}
  [data-m="meta"]{font-size:11px !important}
  [data-m="ctarow"]{gap:12px !important;margin-top:2px !important;flex-direction:row !important;align-items:center !important;flex-wrap:nowrap !important}
  [data-m="cta"]{flex:none !important;justify-content:center !important;padding:13px 18px !important;font-size:14px !important;min-height:44px !important}
  [data-m="ctarow"] a{min-width:0 !important;overflow:hidden !important;text-overflow:ellipsis !important;white-space:nowrap !important;font-size:12px !important}
  [data-m="photo"]{min-height:32dvh !important;cursor:default !important}
  [data-m="portrait"]{padding:10px 0 0 !important}
  [data-m="foot"]{justify-content:center !important;font-size:10.5px !important}
  [data-m="footmeta"]{display:none !important}
  input,textarea{font-size:16px !important}
}
@media (max-width:900px) and (max-height:740px){
  [data-m="note"]{display:none !important}
  [data-m="text"]{gap:14px !important;padding:18px 18px 16px !important}
  [data-m="h1"]{font-size:clamp(28px,8vw,38px) !important}
}
@media (max-width:380px){
  [data-m="ctarow"]{flex-direction:column !important;align-items:stretch !important;gap:10px !important}
  [data-m="ctarow"] a{align-self:center !important}
  [data-m="h1"]{font-size:28px !important}
}
@media (max-height:520px) and (orientation:landscape){
  [data-m="main"]{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) !important;grid-template-rows:1fr !important}
  [data-m="text"]{padding:16px 20px !important;gap:10px !important;justify-content:space-between !important}
  [data-m="note"],[data-m="foot"]{display:none !important}
  [data-m="h1"]{font-size:clamp(24px,5vw,34px) !important;min-height:0 !important}
  [data-m="photo"]{min-height:0 !important}
}
</style>
</helmet>

<div data-m="page" style="height:100vh;overflow:hidden;background:var(--grey-2);font-family:var(--font-sans);color:var(--text-body);display:flex;flex-direction:column;padding:clamp(18px,3vh,34px) clamp(18px,4vw,56px);box-sizing:border-box;gap:clamp(14px,2.4vh,28px)">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex:none">
    <img data-m="logo" src="assets/logo-ink.svg" alt="Refined by Design" style="height: 40px; width: 117px; display: block">
    <div data-m="badge" style="display:flex;align-items:center;gap:9px;padding:6px 13px 6px 11px;border-radius:var(--radius-pill);background:var(--white);box-shadow:var(--shadow-inset-hairline);font-size:11px;font-weight:600;letter-spacing:var(--tracking-meta);text-transform:uppercase;color:var(--ink-3)">
      <span style="position:relative;display:inline-flex;width:7px;height:7px">
        <span style="position:absolute;inset:0;border-radius:50%;background:var(--status-success);animation:rbd-pulse 2.4s var(--ease-out) infinite"></span>
        <span style="position:absolute;inset:0;border-radius:50%;background:var(--status-success)"></span>
      </span>
      Available for projects
    </div>
  </header>

  <main data-m="main" style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:0;background:var(--panel-soft);border-radius:var(--radius-2xl);box-shadow:var(--shadow-inset-hairline);overflow:hidden">

    <section data-m="text" onMouseEnter="{{ hold }}" onMouseLeave="{{ release }}" style="min-width:0;padding:clamp(24px,4vw,52px);display:flex;flex-direction:column;justify-content:space-between;gap:clamp(16px,3vh,32px);animation:rbd-rise .7s var(--ease-out) both">
      <div style="display:flex;flex-direction:column;gap:clamp(12px,2vh,20px)">
        <span data-m="eyebrow" style="font-size:11px;font-weight:600;letter-spacing:var(--tracking-meta);text-transform:uppercase;color:var(--text-muted)">WHAT I'M BUSY WITH</span>
        <h1 data-m="h1" style="margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(38px,5.6vw,74px);line-height:.98;letter-spacing:-0.02em;color:var(--text-strong);text-wrap:pretty;min-height:1.96em;display:flex;align-items:flex-start">
          <span style="transition:opacity .32s var(--ease-out),transform .32s var(--ease-out);opacity: {{ swapOpacity }}; transform: translateY({{ swapShift }})">{{ statusLabel }}</span>
        </h1>
        <p data-m="note" style="margin:0;max-width:36ch;font-size:clamp(14px,1.2vw,17px);line-height:1.55;color:var(--text-body);transition:opacity .32s var(--ease-out);opacity: {{ swapOpacity }}">{{ statusNote }}</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px">
        <div data-m="meta" style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-size:12px;color:var(--text-muted)">
          <span>{{ elapsedLine }}</span>
          <span style="font-family:var(--font-mono);letter-spacing:.02em">{{ counterLine }}</span>
        </div>
        <div style="height:3px;border-radius:999px;background:var(--grey-5);overflow:hidden">
          <div style="height:100%;border-radius:999px;background:var(--ink-1);transition:width .2s linear;width: {{ progressPct }}%"></div>
        </div>
        <div data-m="ctarow" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:clamp(6px,1.5vh,14px)">
          <button data-m="cta" onClick="{{ openForm }}" style="display:inline-flex;align-items:center;gap:9px;padding:15px 26px;border:none;border-radius:var(--radius-md);background:var(--ink-1);color:var(--white);font-family:var(--font-sans);font-size:15px;font-weight:500;cursor:pointer;box-shadow:var(--shadow-sm);transition:background var(--dur-fast) var(--ease-out),transform var(--dur-instant) var(--ease-out)" style-hover="background:var(--ink-2)" style-active="transform:scale(.985)">
            Start a project
            <span style="font-size:15px;line-height:1">↗</span>
          </button>
          <a href="{{ mailtoHref }}" style="font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--line-soft); padding-bottom: 2px; transition: color var(--dur-fast) var(--ease-out); position: relative" style-hover="color:var(--ink-1)">{{ email }}</a>
        </div>
      </div>
    </section>

    <div data-m="photo" ref="{{ photoRef }}" onPointerMove="{{ onMove }}" onPointerEnter="{{ onEnter }}" onPointerLeave="{{ onLeave }}" style="min-width:0;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:flex-end;overflow:hidden;cursor:crosshair;--mx:50%;--my:40%;--r:0px;animation:rbd-rise .7s .12s var(--ease-out) both">
      <img src="./img-lorette-muky4nq3-j58z.png" alt="Lorette — Refined by Design" data-m="portrait" style="position:relative;height:100%;width:100%;object-fit:contain;object-position:right bottom;padding-top:clamp(20px,4vh,48px);box-sizing:border-box;filter:grayscale(1) contrast(1.04);display:block">
      <img src="assets/portrait-lorette-colour.png" alt="" aria-hidden="true" data-m="portrait" style="position:absolute;inset:0;height:100%;width:100%;object-fit:contain;object-position:right bottom;padding-top:clamp(20px,4vh,48px);box-sizing:border-box;display:block;pointer-events:none;-webkit-mask-image:radial-gradient(circle var(--r) at var(--mx) var(--my),#000 55%,transparent 100%);mask-image:radial-gradient(circle var(--r) at var(--mx) var(--my),#000 55%,transparent 100%)">
    </div>
  </main>

  <sc-if value="{{ formOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeForm }}" style="position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(11,11,12,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)">
      <div onClick="{{ stop }}" style="width:100%;max-width:440px;max-height:calc(100vh - 48px);overflow:auto;background:var(--white);border-radius:var(--radius-2xl);padding:clamp(22px,3vw,34px);box-shadow:var(--shadow-lift);animation:rbd-rise .28s var(--ease-out);display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
          <div style="display:flex;flex-direction:column;gap:8px">
            <h3 style="margin:0;font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.05;letter-spacing:-0.02em;color:var(--text-strong)">Start a project</h3>
            <p style="margin:0;font-size:13.5px;line-height:1.55;color:var(--text-body);max-width:34ch">Share a few details and I'll come back with a clear direction.</p>
          </div>
          <button onClick="{{ closeForm }}" aria-label="Close" style="flex:none;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:var(--border-soft);border-radius:var(--radius-sm);background:var(--white);color:var(--ink-3);font-size:14px;cursor:pointer;transition:background var(--dur-fast) var(--ease-out)" style-hover="background:var(--grey-3)">✕</button>
        </div>

        <label style="display:grid;gap:7px">
          <span style="font-size:12px;font-weight:600;color:var(--text-strong)">Your name</span>
          <input onInput="{{ setName }}" placeholder="Jane Cooper" style="border:var(--border-soft);border-radius:var(--radius-sm);background:var(--white);padding:12px 14px;font-family:var(--font-sans);font-size:14px;color:var(--text-strong);outline:none" style-focus="border-color:var(--ink-1);box-shadow:var(--shadow-focus)">
        </label>
        <label style="display:grid;gap:7px">
          <span style="font-size:12px;font-weight:600;color:var(--text-strong)">Your email</span>
          <input onInput="{{ setFrom }}" type="email" placeholder="jane@company.com" style="border:var(--border-soft);border-radius:var(--radius-sm);background:var(--white);padding:12px 14px;font-family:var(--font-sans);font-size:14px;color:var(--text-strong);outline:none" style-focus="border-color:var(--ink-1);box-shadow:var(--shadow-focus)">
        </label>
        <label style="display:grid;gap:7px">
          <span style="font-size:12px;font-weight:600;color:var(--text-strong)">What do you need</span>
          <textarea onInput="{{ setMessage }}" rows="3" placeholder="A brand and a site for a new studio — launching in October." style="border:var(--border-soft);border-radius:var(--radius-sm);background:var(--white);padding:12px 14px;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--text-strong);outline:none;resize:vertical" style-focus="border-color:var(--ink-1);box-shadow:var(--shadow-focus)"></textarea>
        </label>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <span style="font-size:11.5px;color:var(--text-muted)">Sends to {{ email }}</span>
          <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
            <span style="flex:1 1 100%;order:-1;font-size:12px;line-height:1.45;color:var(--status-error)">{{ errorNote }}</span>
          </sc-if>
          <button onClick="{{ send }}" disabled="{{ sendDisabled }}" style="display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:13px 22px;border:none;border-radius:var(--radius-sm);background:var(--ink-1);color:var(--white);font-family:var(--font-sans);font-size:14px;font-weight:500;cursor:pointer;box-shadow:var(--shadow-sm);transition:background var(--dur-fast) var(--ease-out),transform var(--dur-instant) var(--ease-out)" style-hover="background:var(--ink-2)" style-active="transform:scale(.985)">
            {{ sendLabel }}
            <span style="font-size:14px;line-height:1">↗</span>
          </button>
        </div>
      </div>
    </div>
  </sc-if>

  <footer data-m="foot" style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:11.5px;color:var(--text-muted)">
    <span data-m="footmeta">Building dreams,</span>
    <span style="display:flex;align-items:center;gap:8px">Copyright&nbsp;&nbsp;© Refined By Design 2026</span>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;lorette@refinedbydesign.co.za&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dwellSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:2,&quot;max&quot;:15,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
const STATUSES = [
  { label: 'Grinding the beans', note: 'First pass of the day. Coffee before pixels, always.' },
  { label: 'Sketching wireframes', note: 'Cheap paper, expensive thinking. Layout before polish.' },
  { label: 'Nudging pixels', note: 'It was two pixels off. It mattered.' },
  { label: 'On a client call', note: 'Listening more than talking. Back at the desk shortly.' },
  { label: 'Deep in the design file', note: 'Component surgery in progress. Replies are slow.' },
  { label: 'Shipping a build', note: 'Evidence over opinions — watching the first numbers land.' },
  { label: 'Reading the flow data', note: 'Finding where the funnel leaks before redrawing it.' },
  { label: 'Away from the screen', note: 'Best ideas arrive on a walk. Email still reaches me.' },
];

class Component extends DCLogic {
  state = { i: 0, t: 0, swapping: false, paused: false, formOpen: false, status: 'idle', name: '', from: '', message: '' };

  componentDidMount() {
    this.tick = setInterval(() => {
      if (this.state.paused) return;
      const dur = this.dwell();
      const t = this.state.t + 0.1;
      if (t >= dur) this.advance(this.state.i + 1);
      else this.setState({ t });
    }, 100);
  }
  componentWillUnmount() { clearInterval(this.tick); clearTimeout(this.swapTimer); }

  animR(target) {
    cancelAnimationFrame(this.rRaf);
    const step = () => {
      const el = this.photoRef && this.photoRef.current; if (!el) return;
      this.r = (this.r || 0) + (target - (this.r || 0)) * 0.14;
      if (Math.abs(target - this.r) < 0.5) this.r = target;
      el.style.setProperty('--r', this.r + 'px');
      if (this.r !== target) this.rRaf = requestAnimationFrame(step);
    };
    this.rRaf = requestAnimationFrame(step);
  }

  dwell() { return Math.max(2, Number(this.props.dwellSeconds ?? 6)); }
  list() { return STATUSES; }

  advance(next) {
    const items = this.list();
    if (this.state.swapping) return;
    clearTimeout(this.swapTimer);
    this.setState({ swapping: true, t: 0 });
    this.swapTimer = setTimeout(() => {
      this.setState({ i: ((next % items.length) + items.length) % items.length, swapping: false });
    }, 300);
  }

  renderVals() {
    const items = this.list();
    const { i, t, swapping } = this.state;
    const cur = items[i];
    const dur = this.dwell();
    const email = this.props.email || 'lorette@refinedbydesign.co.za';
    const at = k => items[(i + k) % items.length].label;
    return {
      feed0: at(0), feed1: at(1), feed2: at(2),
      pick0: () => this.advance(i),
      pick1: () => this.advance(i + 1),
      pick2: () => this.advance(i + 2),
      statusLabel: cur.label,
      statusNote: cur.note,
      swapOpacity: swapping ? 0 : 1,
      swapShift: swapping ? '10px' : '0px',
      progressPct: Math.min(100, (t / dur) * 100),
      elapsedLine: this.state.paused ? 'Holding this one' : 'Live status update',
      counterLine: String(i + 1).padStart(2, '0') + ' / ' + String(items.length).padStart(2, '0'),
      email,
      mailtoHref: 'mailto:' + email + '?subject=' + encodeURIComponent('Design project enquiry'),
      next: () => this.advance(i + 1),
      photoRef: this.photoRef || (this.photoRef = React.createRef()),
      onMove: e => {
        const el = this.photoRef.current; if (!el) return;
        const b = el.getBoundingClientRect();
        el.style.setProperty('--mx', (e.clientX - b.left) + 'px');
        el.style.setProperty('--my', (e.clientY - b.top) + 'px');
      },
      onEnter: e => {
        const el = this.photoRef.current; if (!el) return;
        const b = el.getBoundingClientRect();
        el.style.setProperty('--mx', (e.clientX - b.left) + 'px');
        el.style.setProperty('--my', (e.clientY - b.top) + 'px');
        this.animR(Math.max(140, Math.min(b.width, b.height) * 0.42));
      },
      onLeave: () => this.animR(0),
      formOpen: this.state.formOpen,
      openForm: () => this.setState({ formOpen: true, status: 'idle', paused: true }),
      closeForm: () => this.setState({ formOpen: false, paused: false, status: 'idle' }),
      stop: e => e.stopPropagation(),
      setName: e => this.setState({ name: e.target.value }),
      setFrom: e => this.setState({ from: e.target.value }),
      setMessage: e => this.setState({ message: e.target.value }),
      sendLabel: this.state.status === 'sending' ? 'Sending' : this.state.status === 'sent' ? 'Sent · thank you' : 'Send enquiry',
      sendDisabled: this.state.status === 'sending' || this.state.status === 'sent',
      errorNote: this.state.status === 'error' ? "That didn't go through — email me directly at " + email + '.' : '',
      showError: this.state.status === 'error',
      send: async () => {
        const { name, from, message, status } = this.state;
        if (status === 'sending' || status === 'sent') return;
        if (!from.trim() || !message.trim()) { this.setState({ status: 'error' }); return; }
        this.setState({ status: 'sending' });
        try {
          const res = await fetch('https://formspree.io/f/xppalwqz', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ name, email: from, message, _subject: 'Project enquiry' + (name ? ' — ' + name : '') }),
          });
          if (!res.ok) throw new Error('bad status');
          this.setState({ status: 'sent' });
          clearTimeout(this.closeTimer);
          this.closeTimer = setTimeout(() => this.setState({ formOpen: false, paused: false, status: 'idle', name: '', from: '', message: '' }), 2200);
        } catch (e) {
          this.setState({ status: 'error' });
        }
      },
      hold: () => this.setState({ paused: true }),
      release: () => this.setState({ paused: false }),
    };
  }
}

</script>
</body>
</html>
